name: One-time Missione Monaco cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-missione-monaco.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return html.replace(old, new, 1)

          html = replace_once(
              'content="Un dossier interattivo, una missione a Monaco e il primo capitolo di un archivio di amicizia."',
              'content="Un dossier interattivo e una missione a Monaco."',
              "meta description"
          )

          html = replace_once(
              "html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#d8e8e5;font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden}",
              "html{scroll-behavior:smooth;overscroll-behavior-y:none}body{margin:0;background:var(--bg);color:#d8e8e5;font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden;overscroll-behavior-y:none}",
              "overscroll protection"
          )

          start = html.index('<div class="v6-console"')
          end = html.index('<button id="unlock"', start)
          dashboard = '''<div class="v6-console" aria-label="Centro di controllo missione">
            <div class="v6-console-head"><span>MISSION CONTROL // PROGRESS TRACKER</span><span class="v6-live"><i></i> SYSTEM STATUS</span></div>
            <div class="v6-console-grid"><div><small>PROGRESSO DOSSIER</small><strong id="v6-progress">00%</strong></div><div><small>SEGRETI TROVATI</small><strong id="v6-secrets">00 / 04</strong></div></div>
            <div class="v6-meter"><i id="v6-meter-fill"></i></div>
            <p class="v6-footnote">Ogni obiettivo completato e ogni segreto scoperto aggiorna il dossier.</p>
          </div>
          '''
          html = html[:start] + dashboard + html[end:]

          html, removed = re.subn(
              r'<section class="screen hidden" id="diary">.*?</section>\s*',
              '',
              html,
              count=1,
              flags=re.S
          )
          if removed != 1:
              raise SystemExit(f"friendship archive section: expected 1 removal, got {removed}")

          html = replace_once(
              '.terminal,.countdown,.radar-module,.ticket,.checklist-box,.diary-composer,.diary-banner,.diary-entry,.v6-console{box-shadow:0 18px 55px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.025)}',
              '.terminal,.countdown,.radar-module,.ticket,.checklist-box,.v6-console{box-shadow:0 18px 55px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.025)}',
              "archive shadow styles"
          )
          html = replace_once(
              '.v6-console-head,.v6-console-actions,.diary-list-head,.diary-compose-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}',
              '.v6-console-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}',
              "archive flex styles"
          )
          html = replace_once(
              'grid-template-columns:repeat(3,minmax(0,1fr))',
              'grid-template-columns:repeat(2,minmax(0,1fr))',
              "dashboard grid"
          )
          html = replace_once(
              '.v6-console-actions{justify-content:flex-start}.v6-console-actions button{font-size:10px;padding:11px 12px}\n.v6-footnote',
              '.v6-footnote',
              "dashboard actions"
          )

          css_start = html.index("#diary h2")
          css_end = html.index("button{transition:transform", css_start)
          html = html[:css_start] + html[css_end:]

          html = replace_once(
              '@media(hover:hover) and (pointer:fine){.v6-console,.diary-composer,.diary-entry,.diary-banner{transition:transform .25s ease,border-color .25s ease}.v6-console:hover,.diary-composer:hover,.diary-entry:hover,.diary-banner:hover{border-color:rgba(101,255,232,.48)}}',
              '@media(hover:hover) and (pointer:fine){.v6-console{transition:border-color .25s ease}.v6-console:hover{border-color:rgba(101,255,232,.48)}}',
              "archive hover styles"
          )
          html = replace_once(
              '@media(max-width:520px){.v6-console{padding:13px}.v6-console-grid{gap:6px}.v6-console-grid small{font-size:8px;line-height:1.4}.v6-console-actions{display:grid;grid-template-columns:1fr}.v6-console-actions button{width:100%}.diary-composer{padding:13px}.diary-list-head{align-items:flex-start}.diary-tools{width:100%}.diary-tools button{flex:1}.diary-banner{padding:13px}}',
              '@media(max-width:520px){.v6-console{padding:13px}.v6-console-grid{gap:8px}.v6-console-grid small{font-size:8px;line-height:1.4}}',
              "mobile archive styles"
          )

          old_show = """function show(id,opts={}){
           if(!document.getElementById(id))return;
           if(id!==currentScreen){
             if(opts.back){currentScreen=id;}
             else{screenHistory.push(currentScreen);currentScreen=id;}
           }
           screens.forEach(s=>{s.classList.toggle('hidden',s.id!==id);if(s.id===id){s.style.animation='none';void s.offsetWidth;s.style.animation='';}});
           updateScreenNav();
           window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
          }"""
          new_show = """function show(id,opts={}){
           if(!document.getElementById(id))return;
           const changing=id!==currentScreen;
           if(changing){
             if(opts.back){currentScreen=id;}
             else{screenHistory.push(currentScreen);currentScreen=id;}
           }
           screens.forEach(s=>{s.classList.toggle('hidden',s.id!==id);if(s.id===id&&changing){s.style.animation='none';void s.offsetWidth;s.style.animation='';}});
           updateScreenNav();
           // Only reset the scroll when navigating to a different screen, never on a repeated activation.
           if(changing)window.scrollTo({top:0,behavior:'auto'});
          }"""
          html = replace_once(old_show, new_show, "screen navigation")

          block_start = html.index("/* V6 // Persistent local progress + friendship diary. Static-hosting safe. */")
          block_end = html.index("\n\n</script>", block_start)
          progress_script = """/* V6 // Persistent mission progress. Static-hosting safe. */
          (()=>{
           const STORE='meo-intel-v6';
           const safeParse=(value,fallback)=>{try{return JSON.parse(value)||fallback}catch(_){return fallback}};
           let data=safeParse(localStorage.getItem(STORE),{secrets:[],notes:[],checks:[]});
           if(!Array.isArray(data.secrets))data.secrets=[];
           if(!Array.isArray(data.checks))data.checks=[];
           function updateDashboard(){
             const checks=[...document.querySelectorAll('.checks input')];
             const checked=checks.filter(x=>x.checked).length;
             const secretCount=Math.min(4,new Set(data.secrets).size);
             const score=Math.round((Math.min(1,checked/Math.max(1,checks.length))*.55+(secretCount/4)*.45)*100);
             const progress=document.getElementById('v6-progress');
             const secrets=document.getElementById('v6-secrets');
             const meter=document.getElementById('v6-meter-fill');
             if(progress)progress.textContent=String(score).padStart(2,'0')+'%';
             if(secrets)secrets.textContent=String(secretCount).padStart(2,'0')+' / 04';
             if(meter)meter.style.width=score+'%';
           }
           function persist(){
             try{localStorage.setItem(STORE,JSON.stringify(data))}
             catch(_){toast('MEMORIA LOCALE NON DISPONIBILE.')}
             updateDashboard();
           }
           const oldAchievement=window.achievement;
           if(typeof oldAchievement==='function')window.achievement=function(id,msg){
             oldAchievement(id,msg);
             if(!data.secrets.includes(id)){data.secrets.push(id);persist()}
           };
           const checks=[...document.querySelectorAll('.checks input')];
           checks.forEach((input,i)=>{
             input.checked=data.checks.includes(i);
             input.addEventListener('change',()=>{
               data.checks=checks.map((el,n)=>el.checked?n:null).filter(n=>n!==null);
               persist();
             });
           });
           updateDashboard();
          })();"""
          html = html[:block_start] + progress_script + html[block_end:]

          for forbidden in ('id="diary"', 'data-go="diary"', 'ARCHIVIO AMICIZIA', 'VAI AGLI OBIETTIVI', 'diary-', 'v6-notes-count'):
              if forbidden in html:
                  raise SystemExit("archive residue found: " + forbidden)

          path.write_text(html, encoding="utf-8")
          print(f"Updated index.html ({len(html)} characters)")
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/cleanup-missione-monaco.yml
          git commit -m "Fix mobile scroll and remove friendship archive"
          git push
