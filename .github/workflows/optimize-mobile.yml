name: Restore original visual design and fix delayed mobile scroll jump

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-design-and-fix-scroll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore all effects and add a focused mobile scroll recovery
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          # Remove only the previous mobile-effects suppression block. Keep the
          # original fixed scanlines/vignette, Matrix canvas, transitions and 3D.
          start_marker = "/* MOBILE NATIVE SCROLL + COMPOSITOR STABILITY */"
          if start_marker in source:
              start = source.index(start_marker)
              end = source.index("</style>", start)
              source = source[:start] + source[end:]

          # Restore native touch overscroll. Do not change the visual layers.
          source = source.replace(
              "html{scroll-behavior:auto;overscroll-behavior-y:none;overflow-anchor:auto}",
              "html{scroll-behavior:auto;overscroll-behavior-y:auto;overflow-anchor:auto}", 1
          )
          source = source.replace(
              "body{margin:0;background:var(--bg);color:#d8e8e5;font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden;overscroll-behavior-y:none;overflow-anchor:auto}",
              "body{margin:0;background:var(--bg);color:#d8e8e5;font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden;overscroll-behavior-y:auto;overflow-anchor:auto}", 1
          )

          # The fixed boot overlay does not need to lock document scrolling.
          source = source.replace(
              "bootOverlay.classList.remove('done');document.body.style.overflow='hidden';",
              "bootOverlay.classList.remove('done');", 1
          )
          source = source.replace(
              "bootOverlay.classList.add('done');document.body.style.overflow='';",
              "bootOverlay.classList.add('done');", 1
          )

          # Keep the Matrix animation running continuously. Restarting its
          # full-screen canvas shortly after touch-end can provoke compositor bugs.
          source = source.replace(
              "setInterval(()=>{if(document.hidden||performance.now()-lastMotion<220)return;",
              "setInterval(()=>{if(document.hidden)return;", 1
          )

          # Narrow recovery for the reported failure: if Android unexpectedly
          # snaps the document to y=0 after the gesture has ended, restore the
          # last real scroll position. Intentional screen changes and user input
          # are excluded; this does not disable or replace any visual effect.
          guard_marker = "/* MOBILE IDLE SCROLL-JUMP RECOVERY */"
          guard = """\n/* MOBILE IDLE SCROLL-JUMP RECOVERY */
          (() => {
            let lastY = window.scrollY;
            let lastScreen = currentScreen;
            let lastInputAt = performance.now();
            let recovering = false;
            const noteInput = () => { lastInputAt = performance.now(); };
            ['touchstart', 'touchmove', 'wheel', 'pointerdown', 'keydown'].forEach(type =>
              addEventListener(type, noteInput, { passive: true })
            );
            addEventListener('scroll', () => {
              const y = window.scrollY;
              if (currentScreen !== lastScreen) {
                lastScreen = currentScreen;
                lastY = y;
                return;
              }
              if (!recovering && lastY > 80 && y < 8 &&
                  performance.now() - lastInputAt > 900) {
                recovering = true;
                const targetY = lastY;
                requestAnimationFrame(() => {
                  window.scrollTo({ top: targetY, left: 0, behavior: 'auto' });
                  requestAnimationFrame(() => {
                    recovering = false;
                    lastY = window.scrollY;
                  });
                });
                return;
              }
              lastY = y;
            }, { passive: true });
          })();
          """
          if guard_marker not in source:
              anchor = "addEventListener('scroll',markMotion,{passive:true});"
              if anchor not in source:
                  raise SystemExit("ABORT: expected Matrix scroll listener not found")
              source = source.replace(anchor, anchor + guard, 1)

          required = [
              ("#matrix{position:fixed", "fixed Matrix canvas"),
              (".noise{position:fixed", "fixed vignette"),
              ("body:before{content:", "scanline overlay"),
              (".screen:not(.hidden){animation:", "screen transition"),
              ("main{perspective:1200px}", "3D perspective"),
              (guard_marker, "idle scroll recovery"),
          ]
          for token, label in required:
              if token not in source:
                  raise SystemExit(f"ABORT: {label} missing; no changes written")

          path.write_text(source, encoding="utf-8")
          print("Full visual design retained; native overscroll restored and idle top-snap recovery installed.")
          PY
      - name: Commit focused restoration and scroll fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Preserve full design and recover delayed mobile scroll jumps"
          git push origin HEAD:main
