name: Restore full visual design and stabilize Matrix after scroll

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-design-and-fix-scroll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Keep full design and prevent Matrix restart during scroll
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          # The fixed boot overlay already covers the viewport. Locking body overflow
          # is unnecessary and can reset Android's document scroll when it disappears.
          boot_lock = "bootOverlay.classList.remove('done');document.body.style.overflow='hidden';"
          boot_unlock = "bootOverlay.classList.add('done');document.body.style.overflow='';"
          if boot_lock in source:
              source = source.replace(boot_lock, "bootOverlay.classList.remove('done');", 1)
          if boot_unlock in source:
              source = source.replace(boot_unlock, "bootOverlay.classList.add('done');", 1)

          # Keep every signature visual layer and transition enabled.
          checks = [
              ("#matrix{position:fixed", "Matrix canvas"),
              (".noise{position:fixed", "noise/vignette layer"),
              (".screen:not(.hidden){animation:screenIn", "screen entrance animation"),
              ("main{perspective:1200px}", "3D screen perspective"),
          ]
          for token, label in checks:
              if token not in source:
                  raise SystemExit(f"ABORT: {label} is missing; no changes written")

          # The Matrix timer currently pauses during touch/scroll, then resumes 220 ms
          # after the finger is lifted. On mobile that delayed restart coincides with
          # the reported jump. Keep the rain effect until the first real scroll, then
          # freeze its last rendered frame instead of restarting it mid-page.
          replacements = [
              (
                  "let drops=[],cols=0,matrixDpr=1,lastMotion=0,resizeTimer;",
                  "let drops=[],cols=0,matrixDpr=1,lastMotion=0,resizeTimer,matrixPaused=false;"
              ),
              (
                  "function markMotion(){lastMotion=performance.now();}",
                  "function markMotion(event){lastMotion=performance.now();if(event&&(event.type==='scroll'||event.type==='touchmove'||event.type==='wheel'))matrixPaused=true;}"
              ),
              (
                  "setInterval(()=>{if(document.hidden||performance.now()-lastMotion<220)return;",
                  "setInterval(()=>{if(document.hidden||matrixPaused||performance.now()-lastMotion<220)return;"
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"ABORT: expected one occurrence of {old!r}, found {count}")
              source = source.replace(old, new, 1)

          if "display:none !important" in source or "animation:none !important" in source:
              raise SystemExit("ABORT: a mobile visual-effects suppression rule was found")

          path.write_text(source, encoding="utf-8")
          print("Full visual design preserved; Matrix animation no longer restarts after the first user scroll.")
          PY
      - name: Commit focused scroll fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Prevent Matrix animation from resetting mobile scroll"
          git push origin HEAD:main
