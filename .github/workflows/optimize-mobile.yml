name: Restore full visual design and prepare scroll diagnosis # preserve all effects

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore visual effects without changing page content
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          # Remove only the previous touch-only override that hid effects and disabled animations.
          pattern = r'\n\s*/\* MOBILE NATIVE SCROLL \+ COMPOSITOR STABILITY \*/\s*@media \(max-width: 900px\) and \(pointer: coarse\) \{.*?\n\}\s*(?=</style>)'
          source, removed = re.subn(pattern, "\n", source, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit(f"ABORT: expected exactly one previous mobile override, removed {removed}")

          # Restore the original 3D perspective used by the screen entrance animation.
          source, perspective = re.subn(r'main\{perspective:none\}', 'main{perspective:1200px}', source, count=1)
          if perspective != 1:
              raise SystemExit(f"ABORT: expected one perspective override, found {perspective}")

          # Keep a single, predictable document scroll root; don't force body into a second scroll container.
          old_root = "html{scroll-behavior:auto;overflow-x:clip;overscroll-behavior-y:auto;overflow-anchor:auto}body{margin:0;background:var(--bg);color:#d8e8e5;font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:clip;overflow-y:visible;overscroll-behavior-y:auto;overflow-anchor:auto}main,.screen{overflow-anchor:auto}"
          new_root = "html{scroll-behavior:auto;overscroll-behavior-y:auto;overflow-anchor:auto}body{margin:0;background:var(--bg);color:#d8e8e5;font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:clip;overscroll-behavior-y:auto;overflow-anchor:auto}main,.screen{overflow-anchor:auto}"
          if source.count(old_root) != 1:
              raise SystemExit(f"ABORT: expected one root scroll declaration, found {source.count(old_root)}")
          source = source.replace(old_root, new_root, 1)

          # Confirm Matrix, texture layers, and screen animations remain enabled.
          checks = [
              ("#matrix{position:fixed", "Matrix canvas"),
              ("body:before{content:", "scanline texture"),
              (".noise{position:fixed", "noise/vignette layer"),
              (".screen:not(.hidden){animation:screenIn", "screen entrance animation"),
              ("main{perspective:1200px}", "3D screen perspective"),
          ]
          for token, label in checks:
              if token not in source:
                  raise SystemExit(f"ABORT: {label} was not restored")
          if "MOBILE NATIVE SCROLL + COMPOSITOR STABILITY" in source:
              raise SystemExit("ABORT: destructive mobile override remains")
          if source.count("</style>") != 1:
              raise SystemExit("ABORT: style boundary validation failed")

          path.write_text(source, encoding="utf-8")
          print("Restored Matrix, texture layers, blur/entrance animations and 3D perspective.")
          PY
      - name: Commit restored design
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore full mobile visual effects"
          git push origin HEAD:main
