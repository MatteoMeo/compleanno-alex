name: Restore full visual design and prepare scroll diagnosis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix boot overlay scroll handling without changing the design
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          # The fixed boot overlay already covers the viewport. Locking body overflow
          # is unnecessary and can reset Android's document scroll when it disappears.
          boot_lock = "bootOverlay.classList.remove('done');document.body.style.overflow='hidden';"
          boot_unlock = "bootOverlay.classList.add('done');document.body.style.overflow='';"
          if source.count(boot_lock) != 1:
              raise SystemExit(f"ABORT: expected one boot scroll lock, found {source.count(boot_lock)}")
          if source.count(boot_unlock) != 1:
              raise SystemExit(f"ABORT: expected one boot scroll unlock, found {source.count(boot_unlock)}")

          source = source.replace(boot_lock, "bootOverlay.classList.remove('done');", 1)
          source = source.replace(boot_unlock, "bootOverlay.classList.add('done');", 1)

          # Guard against accidentally stripping the site's signature visual layers.
          checks = [
              ("#matrix{position:fixed", "Matrix canvas"),
              (".noise{position:fixed", "noise/vignette layer"),
              (".screen:not(.hidden){animation:screenIn", "screen entrance animation"),
              ("main{perspective:1200px}", "3D screen perspective"),
          ]
          for token, label in checks:
              if token not in source:
                  raise SystemExit(f"ABORT: {label} is missing; no changes written")

          if boot_lock in source or boot_unlock in source:
              raise SystemExit("ABORT: boot scroll lock remains")

          path.write_text(source, encoding="utf-8")
          print("Removed only the boot overlay body overflow toggle; all visual layers remain intact.")
          PY
      - name: Commit scroll fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Prevent boot overlay from resetting mobile scroll"
          git push origin HEAD:main
