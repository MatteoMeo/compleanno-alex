name: Mobile scroll and background stability fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded mobile viewport and compositor fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          marker = "/* MOBILE NATIVE SCROLL + COMPOSITOR STABILITY */"
          if marker in source:
              raise SystemExit("ABORT: mobile stability patch already exists; inspect current source before retrying")

          expected = [
              ("overflow-x:hidden;overscroll-behavior-y:none;overflow-anchor:auto", "root scroll container declaration"),
              ("background-attachment:scroll", "non-fixed background"),
              ("#matrix{position:fixed", "matrix canvas"),
              (".screen:not(.hidden){animation:screenIn", "screen transition")
          ]
          for token, label in expected:
              if source.count(token) != 1:
                  raise SystemExit(f"ABORT: expected one {label}, found {source.count(token)}")

          # Keep the document itself as the native vertical scroller on Android.
          source = source.replace(
              "html{scroll-behavior:auto;overscroll-behavior-y:none;overflow-anchor:auto}",
              "html{scroll-behavior:auto;overflow-x:clip;overscroll-behavior-y:auto;overflow-anchor:auto}",
              1
          )
          source = source.replace(
              "overflow-x:hidden;overscroll-behavior-y:none;overflow-anchor:auto",
              "overflow-x:clip;overflow-y:visible;overscroll-behavior-y:auto;overflow-anchor:auto",
              1
          )

          mobile_css = """
          /* MOBILE NATIVE SCROLL + COMPOSITOR STABILITY */
          @media (max-width: 900px) and (pointer: coarse) {
            html {
              overflow-x: clip !important;
              overscroll-behavior-y: auto !important;
              -webkit-overflow-scrolling: touch;
            }
            body {
              position: relative;
              overflow-x: clip !important;
              overflow-y: visible !important;
              overscroll-behavior-y: auto !important;
              touch-action: pan-y pinch-zoom;
              background-attachment: scroll !important;
            }
            /* Keep the cyberpunk texture, but avoid multiple viewport-fixed paint layers. */
            body:before, body:after, .noise {
              position: absolute !important;
              inset: 0;
            }
            /* Matrix is decorative; its continuously repainted fixed canvas was competing with touch scrolling. */
            #matrix { display: none !important; }
            /* Avoid transformed/filtered full-page layers while the browser is compositing a touch scroll. */
            main, .screen, .screen:not(.hidden) {
              transform: none !important;
              filter: none !important;
              animation: none !important;
              will-change: auto !important;
            }
          }
          """

          close_style = source.rfind("</style>")
          if close_style < 0:
              raise SystemExit("ABORT: closing style tag not found")
          source = source[:close_style] + mobile_css + "\n" + source[close_style:]

          if "overflow-x:hidden;overscroll-behavior-y:none;overflow-anchor:auto" in source:
              raise SystemExit("ABORT: old body scroll container declaration remains")
          if marker not in source or "#matrix { display: none !important; }" not in source:
              raise SystemExit("ABORT: mobile compositor rules missing")
          if source.count("</style>") != 1 or not source.lstrip().lower().startswith("<!doctype html>") or not source.rstrip().lower().endswith("</body></html>"):
              raise SystemExit("ABORT: HTML boundary validation failed")

          path.write_text(source, encoding="utf-8")
          print(f"Patched {path}; {len(source)} characters; guarded viewport/compositor checks passed.")
          PY
      - name: Commit optimized site
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Stabilize Android native scrolling and background layers"
          git push origin HEAD:main
